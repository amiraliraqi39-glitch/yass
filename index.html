<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتحاد الادباء والكتاب في البصرة</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f9f9f9; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
        .card h3 { margin: 10px 0; color: #333; }
        .card p { color: #666; line-height: 1.6; }
        .author { color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1>📚 اتحاد الأدباء والكتاب في البصرة</h1>
    </div>

    <div class="grid" id="publications-container">
        <p style="text-align:center; width:100%;" id="loading-text">جاري تحميل المنشورات...</p>
    </div>

    <script>
        async function loadPublications() {
            try {
                // جلب ملف المنشورات الذي ستنشئه لوحة التحكم
                const response = await fetch('/content/publications.json');
                
                if (!response.ok) {
                    throw new Error('لم يتم العثور على ملف المنشورات.');
                }

                const posts = await response.json();
                const container = document.getElementById('publications-container');
                container.innerHTML = ''; // إخفاء كلمة جاري التحميل

                if(!posts || posts.length === 0) {
                    container.innerHTML = '<p style="text-align:center; width:100%;">لا توجد منشورات حالياً. اذهب إلى /admin لإضافة منشورات.</p>';
                    return;
                }

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const imgSrc = post.image ? post.image : 'https://via.placeholder.com/300x200?text=لا+توجد+صورة';
                    
                    card.innerHTML = `
                        <img src="${imgSrc}" alt="${post.title}">
                        <h3>${post.title}</h3>
                        <p class="author">✍️ ${post.author}</p>
                        <p>${post.description}</p>
                    `;
                    
                    container.appendChild(card);
                });

            } catch (error) {
                // إذا لم توجد منشورات بعد، نعرض رسالة بدلاً من التعليق
                document.getElementById('publications-container').innerHTML = `
                    <div style="text-align:center; width:100%; padding: 50px; background: white; border-radius: 10px;">
                        <h2>مرحباً بك في الموقع!</h2>
                        <p>الموقع يعمل بنجاح. يرجى الذهاب إلى لوحة التحكم لإضافة أول منشور.</p>
                        <a href="/admin" style="display:inline-block; margin-top:15px; padding:10px 20px; background:#007bff; color:white; text-decoration:none; border-radius:5px;">الذهاب إلى لوحة التحكم</a>
                    </div>
                `;
            }
        }

        loadPublications();
    </script>
</body>
</html>
