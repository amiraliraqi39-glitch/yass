backend:
  name: git-gateway
  branch: main # تأكد أن هذا هو اسم الفرع الرئيسي لديك

media_folder: "public/images" # مكان حفظ الصور في GitHub
public_folder: "/images" # المسار الذي سيقرأ منه الموقع الصور

collections:
  - name: "publications"
    label: "المنشورات الأدبية"
    folder: "content/publications"
    create: true
    fields:
      - { label: "نوع العمل (رواية، شعر، الخ)", name: "type", widget: "string" }
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "المؤلف", name: "author", widget: "string" }
      - { label: "الوصف", name: "description", widget: "text" }
      - { label: "صورة الغلاف", name: "image", widget: "image" } # هذا هو الزر الذي سيرفع الصور مباشرة
