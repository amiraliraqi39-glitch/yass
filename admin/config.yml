backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "publications"
    label: "المنشورات الأدبية"
    folder: "content/publications"
    create: true
    # هذا السطر يقوم بإنشاء ملف JSON تلقائياً ليقرأه الموقع
    format: "json" 
    extension: "json"
    fields:
      - { label: "نوع العمل", name: "type", widget: "string" }
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "المؤلف", name: "author", widget: "string" }
      - { label: "الوصف", name: "description", widget: "text" }
      - { label: "صورة الغلاف", name: "image", widget: "image" }
